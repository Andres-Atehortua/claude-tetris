<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var stored = localStorage.getItem('tetris-theme');
      var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <span class="top-bar-spacer" aria-hidden="true"></span>
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" for="theme-toggle" title="Cambiar entre modo oscuro y claro">
        <input type="checkbox" id="theme-toggle" aria-label="Alternar modo claro u oscuro" />
        <span class="theme-switch-track">
          <span class="theme-switch-icon theme-switch-icon-moon" aria-hidden="true">&#9789;</span>
          <span class="theme-switch-icon theme-switch-icon-sun" aria-hidden="true">&#9728;</span>
          <span class="theme-switch-thumb"></span>
        </span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="value powerup-value" id="powerup-status">—</span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li>Pieza especial: estalla al caer</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
